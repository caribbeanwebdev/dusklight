name: Deploy web build to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build brotli

      - name: Setup emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.0
          actions-cache-folder: emsdk-cache

      - name: Configure
        run: cmake --preset web-default-release

      - name: Build
        run: cmake --build --preset web-default-release

      - name: Stage deploy directory
        run: bash tools/deploy-pages.sh build/web-default-release dist/web

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/web --project-name=dusklight --branch=main
